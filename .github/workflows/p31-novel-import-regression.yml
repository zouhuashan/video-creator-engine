name: P31 Novel Import Regression

on:
  push:
    branches: [main]
    paths:
      - "scripts/novel_web_import.py"
      - "scripts/novel_source_catalog.py"
      - "scripts/novel_source_ingest.py"
      - "scripts/web_server.py"
      - "scripts/comfyui_lora_manager.py"
      - "support/providers/comfyui_image_provider.py"
      - "support/providers/openai_image_provider.py"
      - "config/providers/comfyui-image-provider.json"
      - "config/providers/image-style-presets.json"
      - "web/**"
      - "tests/test_novel_web_import.py"
      - "tests/test_novel_source_catalog.py"
      - "tests/test_web_server.py"
      - "tests/test_comfyui_image_provider.py"
      - "tests/test_comfyui_lora_manager.py"
      - "tests/test_openai_image_provider.py"
      - ".github/workflows/p31-novel-import-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: |
          python -m py_compile \
            scripts/novel_web_import.py \
            scripts/novel_source_catalog.py \
            scripts/novel_source_ingest.py \
            scripts/comfyui_lora_manager.py \
            scripts/web_server.py \
            support/providers/comfyui_image_provider.py \
            support/providers/openai_image_provider.py
      - name: Check LoRA manager direct and module entrypoints
        run: |
          python scripts/comfyui_lora_manager.py >/tmp/comfyui-lora-direct.json
          python -m scripts.comfyui_lora_manager >/tmp/comfyui-lora-module.json
      - name: Check Web JavaScript syntax
        run: node --check web/app.js
      - name: Run P31 regression
        run: |
          python -m unittest \
            tests.test_novel_source_catalog \
            tests.test_novel_web_import \
            tests.test_web_server.WebServerTests.test_web_exposes_automatic_character_bootstrap_without_txt_reupload \
            tests.test_web_server.WebServerTests.test_web_exposes_project_delete_action \
            tests.test_web_server.WebServerTests.test_delete_novel_project_removes_project_and_returns_newest_default \
            tests.test_web_server.WebServerTests.test_image_studio_explains_cinematic_3d_default_and_local_preview_boundary \
            tests.test_web_server.WebServerTests.test_image_style_presets_default_to_cinematic_3d_and_keep_illustration_lora_separate \
            tests.test_comfyui_image_provider \
            tests.test_comfyui_lora_manager \
            tests.test_openai_image_provider
