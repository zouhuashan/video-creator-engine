name: P31 Novel Import Regression

on:
  push:
    branches: [main]
    paths:
      - "scripts/novel_web_import.py"
      - "scripts/novel_source_catalog.py"
      - "scripts/novel_source_ingest.py"
      - "scripts/novel_episode_script.py"
      - "scripts/novel_scene_backfill.py"
      - "scripts/web_server.py"
      - "scripts/comfyui_lora_manager.py"
      - "scripts/graybox_shot_spec.py"
      - "scripts/graybox_manager.py"
      - "scripts/graybox_reference_binding.py"
      - "scripts/voice_timeline.py"
      - "scripts/final_audio_pipeline.py"
      - "scripts/gpt_keyframe_pipeline.py"
      - "scripts/codex_keyframe_batch.py"
      - "scripts/cost_first_hybrid_router.py"
      - "adapters/video_generation/__init__.py"
      - "adapters/video_generation/local_micro_motion.py"
      - "adapters/video_generation/local_scene_plate.py"
      - "adapters/video_generation/local_two_cut.py"
      - "adapters/video_generation/router.py"
      - "scripts/cost_first_local_renderer.py"
      - "config/cost-first-rendering.json"
      - "config/video-provider-routes.json"
      - "scripts/blender_graybox_scene.py"
      - "config/graybox-to-video.json"
      - "adapters/video_generation/minimax_h3.py"
      - "support/providers/comfyui_image_provider.py"
      - "support/providers/openai_image_provider.py"
      - "config/providers/comfyui-image-provider.json"
      - "config/providers/image-style-presets.json"
      - "web/**"
      - "tests/test_novel_web_import.py"
      - "tests/test_novel_source_catalog.py"
      - "tests/test_web_server.py"
      - "tests/test_comfyui_image_provider.py"
      - "tests/test_comfyui_lora_manager.py"
      - "tests/test_openai_image_provider.py"
      - "tests/test_graybox_shot_spec.py"
      - "tests/test_graybox_manager.py"
      - "tests/test_graybox_reference_binding.py"
      - "tests/test_minimax_h3.py"
      - "tests/test_voice_timeline.py"
      - "tests/test_final_audio_pipeline.py"
      - "tests/test_gpt_keyframe_pipeline.py"
      - "tests/test_codex_keyframe_batch.py"
      - "tests/test_cost_first_hybrid_router.py"
      - "tests/test_cost_first_local_renderer.py"
      - "tests/test_local_micro_motion.py"
      - ".agents/skills/p35-keyframe-render/**"
      - ".github/workflows/p31-novel-import-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web test dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Compile Python
        run: |
          python -m py_compile \
            scripts/novel_web_import.py \
            scripts/novel_source_catalog.py \
            scripts/novel_source_ingest.py \
            scripts/novel_episode_script.py \
            scripts/novel_scene_backfill.py \
            scripts/comfyui_lora_manager.py \
            scripts/graybox_shot_spec.py \
            scripts/graybox_manager.py \
            scripts/graybox_reference_binding.py \
            scripts/voice_timeline.py \
            scripts/final_audio_pipeline.py \
            scripts/gpt_keyframe_pipeline.py \
            scripts/codex_keyframe_batch.py \
            scripts/cost_first_hybrid_router.py \
            adapters/video_generation/local_micro_motion.py \
            adapters/video_generation/local_scene_plate.py \
            adapters/video_generation/local_two_cut.py \
            adapters/video_generation/router.py \
            scripts/cost_first_local_renderer.py \
            scripts/blender_graybox_scene.py \
            scripts/web_server.py \
            adapters/video_generation/minimax_h3.py \
            support/providers/comfyui_image_provider.py \
            support/providers/openai_image_provider.py
      - name: Check LoRA manager direct and module entrypoints
        run: |
          python scripts/comfyui_lora_manager.py >/tmp/comfyui-lora-direct.json
          python -m scripts.comfyui_lora_manager >/tmp/comfyui-lora-module.json
      - name: Check Web JavaScript syntax
        run: node --check web/app.js
      - name: Run P31 regression
        run: |
          python -m unittest \
            tests.test_novel_source_catalog \
            tests.test_novel_web_import \
            tests.test_web_server.WebServerTests.test_web_exposes_automatic_character_bootstrap_without_txt_reupload \
            tests.test_web_server.WebServerTests.test_web_exposes_project_delete_action \
            tests.test_web_server.WebServerTests.test_delete_novel_project_removes_project_and_returns_newest_default \
            tests.test_web_server.WebServerTests.test_image_studio_explains_cinematic_3d_default_and_blocks_local_preview \
            tests.test_web_server.WebServerTests.test_image_style_presets_default_to_cinematic_3d_and_keep_illustration_lora_separate \
            tests.test_web_server.WebServerTests.test_cinematic_3d_final_route_refuses_local_animagine_fallback \
            tests.test_web_server.WebServerTests.test_cinematic_3d_final_route_rejects_explicit_comfyui \
            tests.test_web_server.WebServerTests.test_web_exposes_p32_graybox_workflow_without_terminal_steps \
            tests.test_web_server.WebServerTests.test_p34_final_audio_web_exposes_voice_lock_billing_gate_and_mix_without_secret \
            tests.test_web_server.WebServerTests.test_p35_gpt_keyframe_web_exposes_codex_batch_manual_fallback_and_local_interpolation \
            tests.test_web_server.WebServerTests.test_p36_cost_first_web_exposes_local_first_routes_and_h3_lock \
            tests.test_web_server.WebServerTests.test_http_byte_range_parser_supports_video_streaming_ranges \
            tests.test_web_server.WebServerTests.test_p32_video_preview_does_not_reset_same_src_during_state_refresh \
            tests.test_web_server.WebServerTests.test_graybox_final_requires_human_approved_blockout \
            tests.test_graybox_shot_spec \
            tests.test_graybox_manager \
            tests.test_graybox_reference_binding \
            tests.test_minimax_h3 \
            tests.test_voice_timeline \
            tests.test_final_audio_pipeline \
            tests.test_gpt_keyframe_pipeline \
            tests.test_codex_keyframe_batch \
            tests.test_cost_first_hybrid_router \
            tests.test_cost_first_video_generation_router \
            tests.test_cost_first_local_renderer \
            tests.test_local_scene_plate \
            tests.test_local_micro_motion \
            tests.test_local_two_cut \
            tests.test_web_server.WebServerTests.test_graybox_final_passes_character_and_scene_images_to_minimax \
            tests.test_web_server.WebServerTests.test_graybox_smoke_review_tracks_exact_latest_final_and_three_axes \
            tests.test_comfyui_image_provider \
            tests.test_comfyui_lora_manager \
            tests.test_openai_image_provider
