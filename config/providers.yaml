# Select adapters here; credentials are read from environment variables only.
schema_version: 1

selection:
  # These providers are intentionally unset until their adapters are selected.
  llm: null
  search: null
  asr: null
  tts: fish_audio
  image: null
  video: local_ken_burns
  video_generation: local_ken_burns
  motion: hyperframes
  publish: manual

fallback:
  asr: [whisper_api, local_whisper, other]
  tts: [elevenlabs, edge_tts, local]
  motion: static_infographic
  video_generation: [stock, screenshot, image_pan]

providers:
  llm: {}
  search: {}
  asr:
    elevenlabs:
      adapter: elevenlabs
      enabled: false
      api_key_env: ELEVENLABS_API_KEY
    whisper:
      adapter: local_whisper
      enabled: false
      mode: local
    whisper_api:
      adapter: whisper_api
      enabled: false
      api_key_env: OPENAI_API_KEY
    other:
      adapter: other
      enabled: false
  tts:
    fish_audio:
      adapter: fish_audio
      enabled: true
      api_key_env: FISH_AUDIO_API_KEY
    elevenlabs:
      adapter: elevenlabs
      enabled: false
      api_key_env: ELEVENLABS_API_KEY
    edge_tts:
      adapter: edge_tts
      enabled: true
      mode: remote
      credentials_required: false
    local:
      adapter: macos_say
      enabled: true
      mode: local
      credentials_required: false
      voice: Tingting
  image: {}
  video:
    local_ken_burns:
      adapter: local_ken_burns
      enabled: true
      mode: local
      credentials_required: false
    runway:
      adapter: runway
      enabled: false
      mode: remote
      credentials_required: true
      api_key_env: RUNWAY_API_KEY
  motion:
    hyperframes:
      adapter: hyperframes
      enabled: true
    remotion:
      adapter: remotion
      enabled: false
  publish:
    manual:
      adapter: manual_review
      enabled: true
      automatic_upload: false
