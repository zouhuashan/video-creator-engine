# Select adapters here; credentials are read from environment variables only.
schema_version: 1

selection:
  # These providers are intentionally unset until their adapters are selected.
  llm: null
  search: null
  asr: null
  tts: kokoro_local
  image: null
  video: local_ken_burns
  video_generation: minimax_h3
  motion: hyperframes
  publish: manual

fallback:
  asr: [whisper_api, local_whisper, other]
  tts: [gpt_sovits_local, fish_audio, elevenlabs, edge_tts, local]
  motion: static_infographic
  video_generation: [stock, screenshot, image_pan]

providers:
  llm: {}
  search: {}
  asr:
    elevenlabs:
      adapter: elevenlabs
      enabled: false
      api_key_env: ELEVENLABS_API_KEY
    whisper:
      adapter: local_whisper
      enabled: false
      mode: local
    whisper_api:
      adapter: whisper_api
      enabled: false
      api_key_env: OPENAI_API_KEY
    other:
      adapter: other
      enabled: false
  tts:
    kokoro_local:
      adapter: kokoro_sherpa
      enabled: true
      mode: local
      credentials_required: false
      runtime_dir: .dependencies/kokoro-runtime
      model_dir: .dependencies/models/kokoro-int8-multi-lang-v1_1
      python_executable: .dependencies/python-bin/python3.13
      voice: zm_010
      sample_rate: 24000
      num_threads: 2
    gpt_sovits_local:
      adapter: gpt_sovits_local
      enabled: false
      mode: local
      credentials_required: false
      endpoint: http://127.0.0.1:9880
      voice_profiles_file: config/gpt-sovits-voices.json
    fish_audio:
      adapter: fish_audio
      enabled: true
      api_key_env: FISH_AUDIO_API_KEY
    elevenlabs:
      adapter: elevenlabs
      enabled: false
      api_key_env: ELEVENLABS_API_KEY
    edge_tts:
      adapter: edge_tts
      enabled: true
      mode: remote
      credentials_required: false
    local:
      adapter: macos_say
      enabled: true
      mode: local
      credentials_required: false
      voice: Tingting
  image: {}
  video:
    wavespeed_wan:
      adapter: wavespeed_wan
      enabled: true
      mode: remote
      credentials_required: true
      api_key_env: WAVESPEED_API_KEY
      workflow: reference_video_to_video
      default_resolution: 480p
      default_mode: video_edit
      max_cost_cny: 2.0
      billable_confirmation_required: true
    local_micro_motion:
      adapter: local_micro_motion
      enabled: true
      mode: local
      credentials_required: false
    local_ken_burns:
      adapter: local_ken_burns
      enabled: true
      mode: local
      credentials_required: false
    minimax_h3:
      adapter: minimax_h3
      enabled: true
      mode: remote
      credentials_required: true
      api_key_env: MINIMAX_API_KEY
      model: MiniMax-H3
      workflow: reference_to_video
    runway:
      adapter: runway
      enabled: false
      mode: remote
      credentials_required: true
      api_key_env: RUNWAY_API_KEY
    openai_sora:
      adapter: openai_sora
      enabled: true
      mode: remote
      credentials_required: true
      api_key_env: OPENAI_API_KEY
    wan:
      adapter: wan
      enabled: false
      mode: remote
      credentials_required: true
      api_key_env: FAL_KEY
  motion:
    hyperframes:
      adapter: hyperframes
      enabled: true
    remotion:
      adapter: remotion
      enabled: false
  publish:
    manual:
      adapter: manual_review
      enabled: true
      automatic_upload: false
